<div class="customs-container p-4">
    <!-- Main container for account details -->
    @let account = facade.account$ | async;

    <div class="row h-100">
        <!-- Left Section: Account info, profile image and address form -->
        <div class="col-3 h-100">
            <app-account-info-form
                [account]="account"
                [accountImgUrl]="(facade.accountImgUrl$ | async) ?? ''"
                (back)="backToAccountGrid()">
            </app-account-info-form>
        </div>

        <!-- Right Section: Compliance tabs -->
        <div class="col-9">
            <app-account-compliance
                [account]="account"
                [checks]="(facade.checks$ | async) ?? []"
                [accessoryTools]="(facade.accessoryTools$ | async) ?? []"
                [groupedLookupData]="(facade.groupedLookupData$ | async) ?? []"
                [selectedChecks]="(facade.selectedChecks$ | async) ?? []"
                [selectedAccessoryTools]="(facade.selectedAccessoryTools$ | async) ?? []"
                [accountScrappedData]="(facade.accountScrappedData$ | async) ?? []"
                [isSuperAdmin]="facade.isSuperAdmin"
                [isAdmin]="facade.isAdmin">
            </app-account-compliance>
        </div>
    </div>
</div>

<div class="customs-container p-4">
    <!-- Main container for account details -->
    @let account = facade.account$ | async;

    <div class="row h-100">
        <!-- Left Section: Account info, profile image and address form -->
        <div class="col-3 h-100">
            <app-account-info-form
                [account]="account"
                [accountImgUrl]="(facade.accountImgUrl$ | async) ?? ''"
                (back)="backToAccountGrid()">
            </app-account-info-form>
        </div>

        <!-- Right Section: Tabs -->
        <div class="col-9">
            <div class="card">
                <div class="card-body customs-container">
                    <div class="page-header">Account Setup</div>

                    <div class="custom-main-tab-block">
                        <tabset class="custom-tabset-block">

                            <!-- SharePoint Tab -->
                            <tab>
                                <ng-template tabHeading>
                                    Sharepoint
                                    <span class="status-badge text-warning"
                                        *ngIf="account?.isSharePointConnected === false && !account?.sharePointConnectionError">
                                        <i class="fas fa-shield-alt"></i>
                                    </span>
                                    <span class="status-badge text-success"
                                        *ngIf="account?.isSharePointConnected">
                                        <i class="fas fa-shield-alt"></i>
                                    </span>
                                    <span class="status-badge text-danger"
                                        *ngIf="account?.sharePointConnectionError">
                                        <i class="fas fa-shield-alt"></i>
                                    </span>
                                </ng-template>
                                <app-sharepoint-config [accountData]="account"></app-sharepoint-config>
                            </tab>

                        </tabset>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
